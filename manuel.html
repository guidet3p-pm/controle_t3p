<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10243a">
  <title>Manuel T3P</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
      background: #eef2f6;
    }

    .topbar {
      position: fixed;
      inset: 0 0 auto 0;
      z-index: 10;
      height: 58px;
      display: flex;
      align-items: center;
      padding: 8px 12px;
      background: #10243a;
    }

    .back {
      padding: 11px 15px;
      color: white;
      background: #24527a;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
    }

    #viewer {
      position: absolute;
      top: 58px;
      bottom: 0;
      left: 0;
      right: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 10px;
    }

    .page {
      margin: 0 auto 12px;
      max-width: 100%;
      background: white;
      box-shadow: 0 1px 5px #0002;
    }

    .page canvas {
      display: block;
      width: 100%;
      height: auto;
    }

    #status {
      padding: 20px;
      text-align: center;
      color: #10243a;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="back" href="./index.html">
      ← Retour à l’application
    </a>
  </header>

  <main id="viewer">
    <div id="status">Chargement du manuel…</div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    const viewer = document.getElementById('viewer');
    const status = document.getElementById('status');

    async function loadManual() {
      try {
        if (!window.pdfjsLib) {
          throw new Error('Le lecteur PDF ne s’est pas chargé.');
        }

        pdfjsLib.GlobalWorkerOptions.workerSrc =
          'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        const pdf = await pdfjsLib.getDocument(
          './manuel/Manuel_T3P_Police_Municipale_Smartphone.pdf'
        ).promise;

        status.textContent = 'Préparation du manuel…';

        for (let n = 1; n <= pdf.numPages; n++) {
          const page = await pdf.getPage(n);
          const base = page.getViewport({ scale: 1 });
          const scale = (viewer.clientWidth - 20) / base.width;
          const ratio = window.devicePixelRatio || 1;
          const viewport = page.getViewport({ scale: scale * ratio });

          const wrapper = document.createElement('div');
          wrapper.className = 'page';

          const canvas = document.createElement('canvas');
          canvas.width = Math.floor(viewport.width);
          canvas.height = Math.floor(viewport.height);
          canvas.style.width = (base.width * scale) + 'px';
          canvas.style.height = (base.height * scale) + 'px';

          wrapper.appendChild(canvas);
          viewer.appendChild(wrapper);

          await page.render({
            canvasContext: canvas.getContext('2d'),
            viewport: viewport
          }).promise;
        }

        status.remove();
      } catch (error) {
        status.textContent =
          'Impossible de charger le manuel. Vérifie ta connexion Internet et réessaie.';
        console.error(error);
      }
    }

    loadManual();
  </script>
</body>
</html>
